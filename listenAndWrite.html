<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>听写帮手</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px;
      }
      iframe {
        width: 80%;
        height: 400px;
        border: none;
        margin-bottom: 20px;
      }
      .input-container {
        margin-bottom: 20px;
      }
      input[type="text"] {
        padding: 10px;
        font-size: 16px;
        width: 300px;
        margin-right: 10px;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
      }
      #backToTop {
        position: fixed;
        bottom: 20px;
        right: 20px;
        padding: 10px 15px;
        font-size: 14px;
        background-color: #007bff;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        display: none;
      }
      #backToTop:hover {
        background-color: #0056b3;
      }
      footer {
        margin-top: 20px;
        text-align: center;
        font-size: 14px;
        color: #555;
      }
      footer a {
        color: #007bff;
        text-decoration: none;
      }
      /* 隐藏统计信息 */
      #statistics {
        display: none;
      }
    </style>
    <!-- Google Tag Manager -->
    <script>
      (function(w,d,s,l,i){
        w[l]=w[l]||[];
        w[l].push({'gtm.start':
        new Date().getTime(),event:'gtm.js'});
        var f=d.getElementsByTagName(s)[0],
        j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
        'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
      })(window,document,'script','dataLayer','GTM-KGX2HZ7Z');
    </script>
    <!-- End Google Tag Manager -->
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript>
      <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KGX2HZ7Z"
      height="0" width="0" style="display:none;visibility:hidden"></iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->

    <h1>听写帮手</h1>

    <!-- Input Container -->
    <div class="input-container">
      <input
        type="text"
        id="wordInput"
        placeholder="输入多个词（用逗号或空格分隔）"
      />
      <button onclick="addWords()">添加词</button>
      <button onclick="processWords()">生成网页</button>
    </div>

    <!-- Display the hyperlink button -->
    <div class="input-container">
      <button onclick="openExternalLink()">查看小学生词汇表</button>
    </div>

    <!-- Content Section -->
    <div id="contentContainer"></div>

    <!-- Back to Top Button -->
    <button id="backToTop" onclick="scrollToTop()">回到顶部</button>

    <!-- Footer with copyright and patent info -->
    <footer>
      <p>&copy; 2024 Study Brighter. All rights reserved.</p>
      <p>
        此工具受
        <a href="https://www.cnipa.gov.cn/">专利保护</a
        >，未经授权禁止复制和分发。
      </p>
      <p>
        版权声明: 本网站内容为 Study Brighter
        的所有权，未经许可不得复制、修改或商业用途。
      </p>
    </footer>

    <!-- Hidden Statistics Section -->
    <div id="statistics"></div>

    <script>
      // 字符串数组
      const words = [];

      // 统计信息对象
      const stats = {
        wordCount: 0,
        charCount: 0,
        wordList: [],
      };

      function addWords() {
        const wordInput = document.getElementById("wordInput");
        const input = wordInput.value.trim();

        if (input) {
          // 根据逗号（中英）或空格分割输入的词语
          const newWords = input.split(/[,、\s]+/).filter((word) => word);
          words.push(...newWords);
          stats.wordCount += newWords.length;
          stats.charCount += newWords.join("").length; // 统计字符总数
          stats.wordList.push(...newWords); // 更新词列表
          alert(`词已添加！当前词列表: ${words.join(", ")}`);
          wordInput.value = "";
        } else {
          alert("请输入有效的词！");
        }
      }

      function processWords() {
        if (words.length === 0) {
          alert("请先添加一些词！");
          return;
        }

        const container = document.getElementById("contentContainer");
        container.innerHTML = ""; // 清空之前的内容

        words.forEach((word) => {
          // 构造 URL
          const mainURL = `https://hanyu.baidu.com/hanyu-page/term/detail?wd=${word}&ptype=zici`;
          const charURLs = Array.from(word).map(
            (char) =>
              `https://dict.baidu.com/s?wd=${char}&cf=rcmd&t=img&ptype=zici`
          );

          // 创建 HTML 结构
          let htmlContent = `
          <div class="word-section">
            <h2>Generated Content for: ${word}</h2>
            <iframe src="${mainURL}" title="Main - ${word}"></iframe>
        `;

          charURLs.forEach((url, index) => {
            htmlContent += `<iframe src="${url}" title="Char ${
              index + 1
            }"></iframe>`;
          });

          htmlContent += `</div>`;

          // 追加到页面
          const section = document.createElement("div");
          section.innerHTML = htmlContent;
          container.appendChild(section);
        });

        // 清空词列表
        words.length = 0;

        // 更新隐藏统计信息
        updateStatistics();

        // 回到网页顶部
        window.scrollTo({ top: 0, behavior: "smooth" });

        // 显示回到顶部按钮
        toggleBackToTop();
      }

      function scrollToTop() {
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function toggleBackToTop() {
        const backToTopButton = document.getElementById("backToTop");
        if (window.scrollY > 200) {
          backToTopButton.style.display = "block";
        } else {
          backToTopButton.style.display = "none";
        }
      }

      function openExternalLink() {
        window.open(
          "https://slyrx.github.io/Tech_Blog/xiaoxuecihuibiao.html",
          "_blank"
        );
      }

      function updateStatistics() {
        const statsDiv = document.getElementById("statistics");

        // 将统计信息写入隐藏的 div
        statsDiv.innerHTML = `
          <p>总词数: ${stats.wordCount}</p>
          <p>总字符数: ${stats.charCount}</p>
          <p>词列表: ${stats.wordList.join(", ")}</p>
        `;
      }

      window.addEventListener("scroll", toggleBackToTop);
    </script>
  </body>
</html>
